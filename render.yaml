services:
  - type: web
    name: traffic-lab-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn backend.config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 90
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: traffic-lab-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
